# Prometheus configuration for load testing monitoring

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  # - "alert.rules.yml"

scrape_configs:
  # Django Backend metrics
  - job_name: 'django-backend'
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 5s
    metrics_path: '/metrics'
    params:
      format: ['prometheus']

  # Go SFU Server metrics
  - job_name: 'sfu-server'
    static_configs:
      - targets: ['sfu:8080']
    scrape_interval: 5s
    metrics_path: '/metrics'

  # PostgreSQL metrics
  - job_name: 'postgresql'
    static_configs:
      - targets: ['db:9187']
    scrape_interval: 10s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
    scrape_interval: 10s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 10s

  # Node.js load testing client metrics
  - job_name: 'load-test-client'
    static_configs:
      - targets: ['load-test-client:9090']
    scrape_interval: 2s

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  # Custom application metrics
  - job_name: 'videocall-app'
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 5s
    metrics_path: '/api/metrics'