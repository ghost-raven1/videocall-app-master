name: Security Scanning

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Dependency Vulnerability Scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      if: matrix.component == 'backend'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      if: matrix.component == 'frontend'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: videocall-frontend/package-lock.json

    - name: Install backend dependencies
      if: matrix.component == 'backend'
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install safety

    - name: Install frontend dependencies
      if: matrix.component == 'frontend'
      run: |
        cd videocall-frontend
        npm ci
        npm install -g npm-audit

    - name: Run Safety (Python) scan
      if: matrix.component == 'backend'
      run: |
        cd backend
        safety check --output json > safety-report.json || true

    - name: Run npm audit (Node.js) scan
      if: matrix.component == 'frontend'
      run: |
        cd videocall-frontend
        npm audit --audit-level=moderate --json > npm-audit-report.json || true

    - name: Upload dependency scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: ${{ matrix.component }}-dependency-scan
        path: |
          backend/safety-report.json
          videocall-frontend/npm-audit-report.json

  # SAST (Static Application Security Testing)
  sast-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Gosec (Go security scanner)
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-fmt sarif -out gosec-report.sarif -severity medium -confidence medium -include=G101,G102,G103,G201,G202,G203,G301,G302,G401,G402,G501,G502,G503,G504,G505,G506 ./streaming-node/...'

    - name: Run Bandit (Python security scanner)
      uses: shundor/python-bandit-action@v1
      with:
        path: backend/
        format: sarif
        output: bandit-report.sarif

    - name: Run ESLint security rules
      run: |
        cd videocall-frontend
        npm ci
        npx eslint . --ext .js,.vue --format sarif --output-file eslint-report.sarif || true

    - name: Upload SAST results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: |
          gosec-report.sarif
          bandit-report.sarif
          eslint-report.sarif

  # Container Image Security Scanning
  container-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build images for scanning
      run: |
        # Build images without pushing for security scanning
        docker build -t videocall-backend:scan ./backend/
        docker build -t videocall-frontend:scan ./videocall-frontend/
        docker build -t videocall-streaming:scan ./streaming-node/

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: videocall-backend:scan
        format: 'sarif'
        output: 'backend-container-report.sarif'

    - name: Run Trivy on frontend image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: videocall-frontend:scan
        format: 'sarif'
        output: 'frontend-container-report.sarif'

    - name: Run Trivy on streaming image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: videocall-streaming:scan
        format: 'sarif'
        output: 'streaming-container-report.sarif'

    - name: Upload container scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: |
          backend-container-report.sarif
          frontend-container-report.sarif
          streaming-container-report.sarif

  # Infrastructure Security Scanning
  infra-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Checkov (Infrastructure as Code scanner)
      uses: bridgecrewio/bridgecrew-action@master
      with:
        api_key: ${{ secrets.BRIDGECREW_API_KEY }}
        directory: .
        framework: dockercompose
        output_format: sarif
        output_file: checkov-report.sarif

    - name: Upload infrastructure scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: checkov-report.sarif

  # Secrets Detection
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        format: sarif
        output-file: gitleaks-report.sarif

    - name: Upload secrets scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: gitleaks-report.sarif

  # License Compliance
  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install license checker
      run: |
        pip install pip-licenses

    - name: Check Python dependencies licenses
      run: |
        cd backend
        pip-licenses --format=json --output-file=license-report.json

    - name: Check Node.js dependencies licenses
      run: |
        cd videocall-frontend
        npm ci
        npx license-checker --json > npm-license-report.json

    - name: Upload license reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: license-compliance-reports
        path: |
          backend/license-report.json
          videocall-frontend/npm-license-report.json

  # Security Summary and Notifications
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast-scan, container-scan, infra-scan, secrets-scan, license-check]
    if: always() && github.event_name == 'schedule'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate security summary
      run: |
        echo "# 🔒 Weekly Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Results" >> security-summary.md
        echo "- ✅ Dependency Vulnerability Scan: Completed" >> security-summary.md
        echo "- ✅ SAST Security Scan: Completed" >> security-summary.md
        echo "- ✅ Container Image Security Scan: Completed" >> security-summary.md
        echo "- ✅ Infrastructure Security Scan: Completed" >> security-summary.md
        echo "- ✅ Secrets Detection: Completed" >> security-summary.md
        echo "- ✅ License Compliance Check: Completed" >> security-summary.md
        echo "" >> security-summary.md
        echo "## Recommendations" >> security-summary.md
        echo "- Review and address any high-severity vulnerabilities found" >> security-summary.md
        echo "- Update dependencies regularly to patch security issues" >> security-summary.md
        echo "- Ensure secrets are not committed to the repository" >> security-summary.md
        echo "- Monitor license compliance for production dependencies" >> security-summary.md

    - name: Upload security summary
      uses: actions/upload-artifact@v3
      with:
        name: security-summary
        path: security-summary.md

    - name: Notify security team
      if: failure()
      run: |
        echo "🚨 Security scan failures detected. Check security summary for details."
        # Add notification logic (Slack, email, etc.)