name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: videocall-backend
  FRONTEND_IMAGE: videocall-frontend
  STREAMING_IMAGE: videocall-streaming

jobs:
  # Code Quality Checks
  quality-checks:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend, streaming]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      if: matrix.component == 'backend'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      if: matrix.component == 'frontend'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: videocall-frontend/package-lock.json

    - name: Set up Go
      if: matrix.component == 'streaming'
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install backend dependencies
      if: matrix.component == 'backend'
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install black isort flake8 mypy

    - name: Install frontend dependencies
      if: matrix.component == 'frontend'
      run: |
        cd videocall-frontend
        npm ci

    - name: Install Go dependencies
      if: matrix.component == 'streaming'
      run: |
        cd streaming-node
        go mod download

    - name: Backend linting and formatting
      if: matrix.component == 'backend'
      run: |
        cd backend
        black --check --diff .
        isort --check-only --diff .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        mypy . --ignore-missing-imports

    - name: Frontend linting
      if: matrix.component == 'frontend'
      run: |
        cd videocall-frontend
        npm run lint
        npm run type-check

    - name: Go linting and formatting
      if: matrix.component == 'streaming'
      run: |
        cd streaming-node
        go fmt ./...
        go vet ./...
        go mod tidy

  # Backend Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_videocall
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Wait for database
      run: |
        until pg_isready -h localhost -p 5432 -U test_user; do
          echo "Waiting for database..."
          sleep 2
        done

    - name: Run backend tests
      env:
        DJANGO_SETTINGS_MODULE: videocall_app.settings
        DB_HOST: localhost
        DB_PASSWORD: test_password
        DB_USER: test_user
        DB_NAME: test_videocall
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend
        python manage.py migrate
        python -m pytest --cov=apps --cov-report=xml --cov-report=html --junitxml=test-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: backend/test-results.xml

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: videocall-frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd videocall-frontend
        npm ci

    - name: Run frontend tests
      run: |
        cd videocall-frontend
        npm run test:run -- --coverage --coverage.reporter=lcov

    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./videocall-frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  # Streaming Node Tests
  streaming-tests:
    name: Streaming Node Tests
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: |
        cd streaming-node
        go mod download

    - name: Run Go tests
      run: |
        cd streaming-node
        go test -v -race -coverprofile=coverage.out ./...

    - name: Upload Go coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./streaming-node/coverage.out
        flags: streaming
        name: streaming-coverage

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, streaming-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build test environment
      run: |
        docker-compose -f tests/docker-compose.test.yml up -d --build

    - name: Wait for services
      run: |
        echo "Waiting for services to be ready..."
        sleep 30

    - name: Run integration tests
      run: |
        cd tests
        chmod +x run-load-tests.sh
        ./run-load-tests.sh

    - name: Upload integration test logs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-logs
        path: tests/*.log

  # Build and Push Images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, streaming-tests, integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      backend-image-tag: ${{ steps.meta.outputs.version }}
      frontend-image-tag: ${{ steps.meta.outputs.version }}
      streaming-image-tag: ${{ steps.meta.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BACKEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./videocall-frontend
        push: true
        tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.FRONTEND_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push streaming image
      uses: docker/build-push-action@v5
      with:
        context: ./streaming-node
        push: true
        tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.STREAMING_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Deployment logic will be implemented in CD workflow
        echo "DEPLOYMENT_URL=staging.video-call-ghost.ru" >> $GITHUB_ENV

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Deployment logic will be implemented in CD workflow
        echo "DEPLOYMENT_URL=video-call-ghost.ru" >> $GITHUB_ENV