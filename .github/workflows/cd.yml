name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  REGISTRY: ghcr.io
  KUBECONFIG: ${{ secrets.KUBECONFIG }}
  STAGING_NAMESPACE: videocall-staging
  PRODUCTION_NAMESPACE: videocall-production

jobs:
  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Deploy to staging with blue-green strategy
      run: |
        echo "🚀 Starting blue-green deployment to staging..."

        # Get current color (blue or green)
        CURRENT_COLOR=$(kubectl get service videocall-app -n ${{ env.STAGING_NAMESPACE }} -o jsonpath='{.spec.selector.app}' 2>/dev/null || echo "blue")

        # Determine target color
        if [ "$CURRENT_COLOR" = "blue" ]; then
          TARGET_COLOR="green"
        else
          TARGET_COLOR="blue"
        fi

        echo "Current: $CURRENT_COLOR, Target: $TARGET_COLOR"

        # Update deployment with new image tag
        sed -i "s|image:.*backend|image: ${{ env.REGISTRY }}/${{ github.repository }}/videocall-backend:staging|g" k8s/staging/backend-deployment.yaml
        sed -i "s|image:.*frontend|image: ${{ env.REGISTRY }}/${{ github.repository }}/videocall-frontend:staging|g" k8s/staging/frontend-deployment.yaml
        sed -i "s|image:.*streaming|image: ${{ env.REGISTRY }}/${{ github.repository }}/videocall-streaming:staging|g" k8s/staging/streaming-deployment.yaml

        # Apply the new deployment
        kubectl apply -f k8s/staging/namespace.yaml
        kubectl apply -f k8s/staging/postgres-config.yaml
        kubectl apply -f k8s/staging/redis-config.yaml
        kubectl apply -f k8s/staging/streaming-deployment.yaml
        kubectl apply -f k8s/staging/backend-deployment.yaml
        kubectl apply -f k8s/staging/frontend-deployment.yaml

        # Wait for rollout to complete
        kubectl rollout status deployment/videocall-${TARGET_COLOR} -n ${{ env.STAGING_NAMESPACE }} --timeout=600s

        # Update service selector to point to new deployment
        kubectl patch service videocall-app -n ${{ env.STAGING_NAMESPACE }} -p "{\"spec\":{\"selector\":{\"app\":\"${TARGET_COLOR}\"}}}" --type=merge

        # Scale down old deployment
        kubectl scale deployment videocall-${CURRENT_COLOR} -n ${{ env.STAGING_NAMESPACE }} --replicas=0

        echo "✅ Blue-green deployment to staging completed successfully"
        echo "STAGING_URL=https://staging.video-call-ghost.ru" >> $GITHUB_ENV

    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests on staging..."
        # Implement smoke tests here
        sleep 30

        # Basic health check
        curl -f https://staging.video-call-ghost.ru/api/health/ || exit 1
        echo "✅ Smoke tests passed"

    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Deployment to staging completed successfully"
        # Add notification logic (Slack, Teams, etc.)

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Manual approval for production deployment
      if: github.event_name == 'workflow_run'
      uses: juliangruber/approve-action@v2
      with:
        timeout: 300
        prompt: "🚀 Deploy to production?"

    - name: Deploy to production with blue-green strategy
      run: |
        echo "🚀 Starting blue-green deployment to production..."

        # Get current color (blue or green)
        CURRENT_COLOR=$(kubectl get service videocall-app -n ${{ env.PRODUCTION_NAMESPACE }} -o jsonpath='{.spec.selector.app}' 2>/dev/null || echo "blue")

        # Determine target color
        if [ "$CURRENT_COLOR" = "blue" ]; then
          TARGET_COLOR="green"
        else
          TARGET_COLOR="blue"
        fi

        echo "Current: $CURRENT_COLOR, Target: $TARGET_COLOR"

        # Update deployment with new image tag
        sed -i "s|image:.*backend|image: ${{ env.REGISTRY }}/${{ github.repository }}/videocall-backend:latest|g" k8s/production/backend-deployment.yaml
        sed -i "s|image:.*frontend|image: ${{ env.REGISTRY }}/${{ github.repository }}/videocall-frontend:latest|g" k8s/production/frontend-deployment.yaml
        sed -i "s|image:.*streaming|image: ${{ env.REGISTRY }}/${{ github.repository }}/videocall-streaming:latest|g" k8s/production/streaming-deployment.yaml

        # Apply the new deployment
        kubectl apply -f k8s/production/namespace.yaml
        kubectl apply -f k8s/production/postgres-config.yaml
        kubectl apply -f k8s/production/redis-config.yaml
        kubectl apply -f k8s/production/streaming-deployment.yaml
        kubectl apply -f k8s/production/backend-deployment.yaml
        kubectl apply -f k8s/production/frontend-deployment.yaml

        # Wait for rollout to complete
        kubectl rollout status deployment/videocall-${TARGET_COLOR} -n ${{ env.PRODUCTION_NAMESPACE }} --timeout=600s

        # Update service selector to point to new deployment
        kubectl patch service videocall-app -n ${{ env.PRODUCTION_NAMESPACE }} -p "{\"spec\":{\"selector\":{\"app\":\"${TARGET_COLOR}\"}}}" --type=merge

        # Scale down old deployment
        kubectl scale deployment videocall-${CURRENT_COLOR} -n ${{ env.PRODUCTION_NAMESPACE }} --replicas=0

        echo "✅ Blue-green deployment to production completed successfully"
        echo "PRODUCTION_URL=https://video-call-ghost.ru" >> $GITHUB_ENV

    - name: Run comprehensive tests
      run: |
        echo "🧪 Running comprehensive tests on production..."
        sleep 60

        # Health checks
        curl -f https://video-call-ghost.ru/api/health/ || exit 1

        # WebSocket test
        # Add WebSocket connectivity test

        # Database connectivity test
        # Add database health check

        echo "✅ All tests passed"

    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Deployment to production completed successfully"
        # Add notification logic (Slack, Teams, etc.)

  # Rollback functionality
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment: ${{ github.event.inputs.environment }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Perform rollback
      run: |
        echo "🔄 Starting rollback..."

        NAMESPACE_VAR="${{ github.event.inputs.environment == 'production' && env.PRODUCTION_NAMESPACE || env.STAGING_NAMESPACE }}"

        # Get current color
        CURRENT_COLOR=$(kubectl get service videocall-app -n $NAMESPACE_VAR -o jsonpath='{.spec.selector.app}')

        # Determine previous color
        if [ "$CURRENT_COLOR" = "blue" ]; then
          PREVIOUS_COLOR="green"
        else
          PREVIOUS_COLOR="blue"
        fi

        echo "Rolling back from $CURRENT_COLOR to $PREVIOUS_COLOR"

        # Scale up previous deployment
        kubectl scale deployment videocall-${PREVIOUS_COLOR} -n $NAMESPACE_VAR --replicas=3

        # Update service selector to point to previous deployment
        kubectl patch service videocall-app -n $NAMESPACE_VAR -p "{\"spec\":{\"selector\":{\"app\":\"${PREVIOUS_COLOR}\"}}}" --type=merge

        # Scale down current deployment
        kubectl scale deployment videocall-${CURRENT_COLOR} -n $NAMESPACE_VAR --replicas=0

        echo "✅ Rollback completed successfully"

    - name: Verify rollback
      run: |
        echo "🔍 Verifying rollback..."

        NAMESPACE_VAR="${{ github.event.inputs.environment == 'production' && env.PRODUCTION_NAMESPACE || env.STAGING_NAMESPACE }}"

        # Wait for rollback to complete
        sleep 30

        # Health check
        if [ "${{ github.event.inputs.environment }}" = "production" ]; then
          curl -f https://video-call-ghost.ru/api/health/ || exit 1
        else
          curl -f https://staging.video-call-ghost.ru/api/health/ || exit 1
        fi

        echo "✅ Rollback verified successfully"

  # Post-deployment monitoring
  monitoring-setup:
    name: Post-deployment Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: (success() && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')))

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup monitoring
      run: |
        echo "📊 Setting up post-deployment monitoring..."

        # Deploy monitoring stack if not exists
        kubectl apply -f k8s/monitoring/namespace.yaml || echo "Monitoring namespace already exists"
        kubectl apply -f k8s/monitoring/prometheus-config.yaml
        kubectl apply -f k8s/monitoring/grafana-deployment.yaml

        # Wait for monitoring services
        kubectl rollout status deployment/prometheus -n monitoring --timeout=300s
        kubectl rollout status deployment/grafana -n monitoring --timeout=300s

        echo "✅ Monitoring setup completed"

    - name: Configure alerts
      run: |
        echo "🚨 Configuring deployment alerts..."

        # Create alert rules for deployment
        cat > alert-rules.yml << EOF
        groups:
        - name: deployment_alerts
          rules:
          - alert: DeploymentFailed
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Deployment {{ $labels.deployment }} failed"
              description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has failed pods"

          - alert: HighErrorRate
            expr: rate(http_requests_total{status!~"2.."}[5m]) / rate(http_requests_total[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 10% for more than 5 minutes"
        EOF

        kubectl apply -f alert-rules.yml

        echo "✅ Alert configuration completed"