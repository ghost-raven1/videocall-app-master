apiVersion: apps/v1
kind: Deployment
metadata:
  name: videocall-blue
  namespace: videocall-production
  labels:
    app: videocall
    version: blue
    environment: production
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: videocall
      version: blue
  template:
    metadata:
      labels:
        app: videocall
        version: blue
        environment: production
    spec:
      containers:
      - name: backend
        image: ghcr.io/${{ github.repository }}/videocall-backend:latest
        ports:
        - containerPort: 8000
          name: backend
        env:
        - name: DEBUG
          value: "False"
        - name: DB_HOST
          value: postgres.videocall-production.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: REDIS_URL
          value: redis://redis.videocall-production.svc.cluster.local:6379/0
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secrets
              key: POSTGRES_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SECRET_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
