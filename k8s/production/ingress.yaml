apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: videocall-ingress
  namespace: videocall-production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/websocket-services: "videocall-app"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - video-call-ghost.ru
    - www.video-call-ghost.ru
    secretName: tls-secret
  rules:
  - host: video-call-ghost.ru
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: videocall-app
            port:
              number: 80
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: videocall-app
            port:
              number: 80
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: videocall-app
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: videocall-frontend
            port:
              number: 80
  - host: www.video-call-ghost.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: videocall-frontend
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming-ingress
  namespace: videocall-production
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "75"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - streaming.video-call-ghost.ru
    secretName: streaming-tls-secret
  rules:
  - host: streaming.video-call-ghost.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: videocall-streaming
            port:
              number: 8080