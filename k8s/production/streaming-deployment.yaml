apiVersion: apps/v1
kind: Deployment
metadata:
  name: videocall-streaming
  namespace: videocall-production
  labels:
    app: videocall-streaming
    environment: production
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: videocall-streaming
  template:
    metadata:
      labels:
        app: videocall-streaming
        environment: production
    spec:
      containers:
      - name: streaming
        image: ghcr.io/${{ github.repository }}/videocall-streaming:latest
        ports:
        - containerPort: 8080
          name: streaming
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: SERVER_ALLOWED_ORIGINS
          value: https://video-call-ghost.ru,https://www.video-call-ghost.ru
        - name: ENVIRONMENT
          value: production
        resources:
          requests:
            cpu: 1000m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: videocall-streaming
  namespace: videocall-production
  labels:
    app: videocall-streaming
    environment: production
spec:
  selector:
    app: videocall-streaming
  ports:
  - port: 8080
    targetPort: 8080
    name: streaming
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: videocall-streaming-hpa
  namespace: videocall-production
  labels:
    app: videocall-streaming
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: videocall-streaming
  minReplicas: 2
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80