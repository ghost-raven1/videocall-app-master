apiVersion: apps/v1
kind: Deployment
metadata:
  name: videocall-frontend
  namespace: videocall-production
  labels:
    app: videocall-frontend
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: videocall-frontend
  template:
    metadata:
      labels:
        app: videocall-frontend
        environment: production
    spec:
      containers:
      - name: frontend
        image: ghcr.io/${{ github.repository }}/videocall-frontend:latest
        ports:
        - containerPort: 80
          name: frontend
        env:
        - name: VITE_API_BASE_URL
          value: https://video-call-ghost.ru/api
        - name: VITE_WS_BASE_URL
          value: wss://video-call-ghost.ru
        - name: VITE_APP_NAME
          value: VideoCall
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: videocall-frontend
  namespace: videocall-production
  labels:
    app: videocall-frontend
    environment: production
spec:
  selector:
    app: videocall-frontend
  ports:
  - port: 80
    targetPort: 80
    name: frontend
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: videocall-frontend-hpa
  namespace: videocall-production
  labels:
    app: videocall-frontend
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: videocall-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80