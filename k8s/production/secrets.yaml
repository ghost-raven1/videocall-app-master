apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: videocall-production
  labels:
    app: postgres
    environment: production
type: Opaque
data:
  # Base64 encoded values - these should be generated securely
  # Generate with: echo -n "your_password" | base64
  POSTGRES_PASSWORD: cHJvZHVjdGlvbl9wYXNzd29yZA==  # "production_password"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: videocall-production
  labels:
    app: videocall
    environment: production
type: Opaque
data:
  # Generate secure secrets for production use
  SECRET_KEY: cHJvZHVjdGlvbl9zZWNyZXRfa2V5X2Zvcl9kamFuZ28=  # Django secret key
  JWT_SECRET: cHJvZHVjdGlvbl9qd3Rfc2VjcmV0X2Zvcl9zdHJlYW1pbmc=  # JWT secret for streaming
---
# TLS Certificate Secret (will be populated by cert-manager or manual creation)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: videocall-production
  labels:
    app: ingress
    environment: production
type: kubernetes.io/tls
data:
  # These would be populated by cert-manager or Let's Encrypt
  tls.crt: ""
  tls.key: ""