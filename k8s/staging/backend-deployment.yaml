apiVersion: v1
kind: Service
metadata:
  name: videocall-app
  namespace: videocall-staging
  labels:
    app: videocall
    environment: staging
spec:
  selector:
    app: videocall
    version: blue
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: websocket
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP