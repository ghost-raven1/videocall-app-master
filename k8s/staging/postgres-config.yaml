apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: videocall-staging
  labels:
    app: postgres
    environment: staging
data:
  POSTGRES_DB: videocall_staging
  POSTGRES_USER: videocall_user
  POSTGRES_PASSWORD: staging_password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: videocall-staging
  labels:
    app: postgres
    environment: staging
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        environment: staging
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - configMapRef:
            name: postgres-config
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - videocall_user
            - -d
            - videocall_staging
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - videocall_user
            - -d
            - videocall_staging
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: videocall-staging
  labels:
    app: postgres
    environment: staging
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  type: ClusterIP