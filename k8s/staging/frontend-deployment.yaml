apiVersion: apps/v1
kind: Deployment
metadata:
  name: videocall-frontend
  namespace: videocall-staging
  labels:
    app: videocall-frontend
    environment: staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: videocall-frontend
  template:
    metadata:
      labels:
        app: videocall-frontend
        environment: staging
    spec:
      containers:
      - name: frontend
        image: ghcr.io/${{ github.repository }}/videocall-frontend:staging
        ports:
        - containerPort: 80
          name: frontend
        env:
        - name: VITE_API_BASE_URL
          value: https://staging.video-call-ghost.ru/api
        - name: VITE_WS_BASE_URL
          value: wss://staging.video-call-ghost.ru
        - name: VITE_APP_NAME
          value: VideoCall-Staging
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: videocall-frontend
  namespace: videocall-staging
  labels:
    app: videocall-frontend
    environment: staging
spec:
  selector:
    app: videocall-frontend
  ports:
  - port: 80
    targetPort: 80
    name: frontend
  type: ClusterIP