# Streaming Node Configuration
server:
  address: "0.0.0.0"
  port: 8080
  read_timeout: "10s"
  write_timeout: "10s"
  max_connections: 1000
  allowed_origins:
    - "*"  # Allow all origins for Docker environment
  enable_profiling: false

webrtc:
  ice_servers:
    - urls:
        - "stun:stun.l.google.com:19302"
    # TURN server for local development
    # For SFU server in Docker: use service name "turn"
    # For browsers: use "localhost" (configured in webrtc.ts)
    - urls:
        - "turn:turn:3478"
      username: "turnuser"
      credential: "turnpassword"
  enable_simulcast: true
  enable_bandwidth_limit: true
  max_bitrate: 5000000    # 5 Mbps
  min_bitrate: 100000     # 100 kbps
  default_bitrate: 1000000 # 1 Mbps

quality:
  enable_adaptation: true
  adaptation_interval: "5s"
  packet_loss_threshold: 0.05    # 5%
  rtt_threshold: "100ms"
  quality_check_interval: "1s"
  bitrate_increase_factor: 1.1
  bitrate_decrease_factor: 0.8

logging:
  level: "info"
  file: ""  # Empty means stdout
  max_size: 100    # MB
  max_age: 30      # days
  max_backups: 3
  compress: true

security:
  enable_tls: false
  cert_file: "cert.pem"
  key_file: "key.pem"
  enable_auth: false
  jwt_secret: ""
  token_expiry_hours: 24

django:
  # Host:port for Django backend (WS URL constructed by client)
  url: "backend:8000"
  enable_websocket: true
  reconnect_interval: "5s"
  max_reconnects: 10
