# nginx-lb.conf - Load Balancer configuration for clustered deployment

# Configuration for sites-enabled - without top-level directives
server {
    listen 80;
    server_name video-call-ghost.ru www.video-call-ghost.ru;

    # Redirect to HTTPS
    location / {
        return 301 https://video-call-ghost.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name video-call-ghost.ru www.video-call-ghost.ru;

    # SSL settings
    ssl_certificate /etc/letsencrypt/live/video-call-ghost.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video-call-ghost.ru/privkey.pem;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    resolver 127.0.0.11 valid=30s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=100r/m;

    # Upstreams
    upstream backend_servers {
        least_conn;
        server backend-1:8000 max_fails=3 fail_timeout=30s;
        server backend-2:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream streaming {
        least_conn;
        server sfu-1:8080 max_fails=3 fail_timeout=30s;
        server sfu-2:8080 max_fails=3 fail_timeout=30s;
        server sfu-3:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream frontend_servers {
        server frontend:80;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 50M;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Backend API
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_set_header Connection "";
        }

        # WebSocket for backend
        location /ws/ {
            limit_req zone=ws_limit burst=20 nodelay;

            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # SFU API
        location /sfu/api/ {
            proxy_pass http://streaming/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # SFU WebSocket
        location /sfu/ws/ {
            proxy_pass http://streaming/ws/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # Static files from backend
        location /static/ {
            proxy_pass http://backend_servers;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Media files (recordings, uploads)
        location /media/ {
            proxy_pass http://backend_servers;
            proxy_cache_valid 200 1h;
            expires 1h;
        }

        # Frontend
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend_servers;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
