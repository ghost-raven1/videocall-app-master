# docker-compose.cluster.yml - Clustered deployment configuration
version: '3.8'

services:
  # Load Balancer
  nginx-lb:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - app-network
    restart: unless-stopped

  # Backend instances (horizontal scaling)
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/staticfiles:ro
      - media_volume:/app/media
      - ./backend/logs:/app/logs
    env_file:
      - .env
    environment:
      - INSTANCE_ID=backend-1
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB:-videocall_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - SFU_HOST=sfu-1
      - SFU_PORT=8080
      - DJANGO_SETTINGS_MODULE=videocall_app.settings
    depends_on:
      static-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - static_volume:/staticfiles:ro
      - media_volume:/app/media
      - ./backend/logs:/app/logs
    env_file:
      - .env
    environment:
      - INSTANCE_ID=backend-2
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB:-videocall_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - SFU_HOST=sfu-1
      - SFU_PORT=8080
      - DJANGO_SETTINGS_MODULE=videocall_app.settings
    depends_on:
      static-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # SFU Cluster (multiple nodes)
  sfu-1:
    build:
      context: ./streaming-node
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - NODE_ID=sfu-1
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  sfu-2:
    build:
      context: ./streaming-node
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - NODE_ID=sfu-2
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  sfu-3:
    build:
      context: ./streaming-node
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    env_file:
      - .env
    environment:
      - NODE_ID=sfu-3
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Database with replication support
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-videocall_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-videocall_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Redis for session sharing and SFU coordination
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network
    restart: unless-stopped

  # Инициализация статических файлов и миграций
  static-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - static_volume:/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_DB=${POSTGRES_DB:-videocall_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    user: "0:0" # Запускаем как root для создания директорий
    command: >
      sh -c "
        echo '🚀 Starting video call app initialization...' &&
        echo '📁 Creating directories and setting permissions...' &&
        mkdir -p /staticfiles /app/media /app/logs &&
        chown -R 1000:1000 /staticfiles /app/media /app/logs &&
        chmod -R 755 /app/logs &&
        echo '🗄️ Running database migrations...' &&
        python manage.py migrate &&
        echo '📦 Collecting static files...' &&
        python manage.py collectstatic --noinput --clear &&
        echo '🔧 Setting final permissions...' &&
        chown -R 1000:1000 /staticfiles /app/media /app/logs &&
        echo '✅ Video call app initialization complete!'
      "
    restart: "no"

  # Frontend
  frontend:
    build:
      context: ./videocall-frontend
      dockerfile: Dockerfile
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  app-network:
    driver: bridge
