version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videocall_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-videocall_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  static-init:
    build:
      context: ./backend
    env_file: .env
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-videocall_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/staticfiles
      - media_volume:/app/media
    user: "0:0"
    command: >
      sh -c "
        echo '🚀 Initializing...' &&
        mkdir -p /staticfiles /app/media &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        chown -R 1000:1000 /staticfiles /app/media &&
        echo '✅ Done.'
      "
    restart: "no"
    networks:
      - app-network

  streaming-node:
    build: ./streaming-node
    expose:
      - "8080"
    env_file: .env
    environment:
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      DJANGO_URL: backend:8000
      LOG_LEVEL: info
      SECURITY_JWT_SECRET: ${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - static_volume:/staticfiles:ro
      - media_volume:/app/media
    env_file: .env
    environment:
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-videocall_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SFU_HOST: streaming-node
      SFU_PORT: 8080
    depends_on:
      static-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      streaming-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/health/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: >
      sh -c "
        echo '🌐 Starting Django backend...' &&
        python manage.py check &&
        daphne -b 0.0.0.0 -p 8000 videocall_app.asgi:application
      "
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./videocall-frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
      - streaming-node
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  app-network:
    name: videocall_network
    driver: bridge
