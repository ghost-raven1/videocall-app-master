services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videocall_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-videocall_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - dev_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

  streaming-node:
    build:
      context: ./streaming-node
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081-8090:8081-8090"  # WebRTC port range
    env_file: .env.dev
    environment:
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      DJANGO_URL: backend:8000
      LOG_LEVEL: debug
      SECURITY_JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - dev_static_volume:/app/staticfiles
      - dev_media_volume:/app/media
    env_file: .env.dev
    environment:
      DEBUG: "True"
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-videocall_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      SFU_HOST: streaming-node
      SFU_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo '🌐 Starting Django backend in DEV mode with Daphne (WebSocket support)...' &&
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        daphne -b 0.0.0.0 -p 8000 videocall_app.asgi:application
      "
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./videocall-frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./videocall-frontend:/app
      - /app/node_modules
    env_file: .env.dev
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_WS_BASE_URL=ws://localhost:8000/ws
      - VITE_SFU_WS_URL=ws://localhost:8080/ws
      - NODE_ENV=development
      - DOCKER_ENV=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - dev_static_volume:/staticfiles:ro
      - dev_media_volume:/app/media:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      streaming-node:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_static_volume:
  dev_media_volume:

networks:
  app-network:
    name: videocall_dev_network
    driver: bridge

